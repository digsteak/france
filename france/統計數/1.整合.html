<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>屬性配點 · 整合（六大屬性）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #f59e0b;
      --gold-soft: rgba(245, 158, 11, 0.16);
      --gold-line: rgba(245, 158, 11, 0.34);
      --line: rgba(148, 163, 184, 0.16);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --panel-bg: linear-gradient(160deg, rgba(22, 31, 50, 0.92), rgba(8, 13, 23, 0.96));
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      padding: 24px clamp(14px, 3vw, 40px) 32px;
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 50% -10%, #1a2740 0%, #0b1220 45%, #06090f 100%);
      min-height: 100vh;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(148, 163, 184, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.055) 1px, transparent 1px);
      background-size: 44px 44px;
      -webkit-mask-image: radial-gradient(circle at 50% 18%, #000 0%, transparent 72%);
      mask-image: radial-gradient(circle at 50% 18%, #000 0%, transparent 72%);
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 1180px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px 22px;
      padding: 18px 20px;
      margin-bottom: 18px;
      border-radius: 18px;
      border: 1px solid rgba(245, 158, 11, 0.22);
      background: linear-gradient(150deg, rgba(20, 29, 47, 0.9), rgba(8, 13, 23, 0.94));
      box-shadow: 0 18px 40px -26px #000, inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .crest {
      width: 48px;
      height: 48px;
      flex: none;
      display: grid;
      place-items: center;
      border-radius: 13px;
      color: #fde68a;
      background: linear-gradient(145deg, #b45309, #7f1d1d 55%, #0f172a);
      border: 1px solid rgba(251, 191, 36, 0.6);
      box-shadow: 0 0 22px rgba(245, 158, 11, 0.25), inset 0 0 12px rgba(0, 0, 0, 0.45);
    }

    .crest svg { width: 24px; height: 24px; }

    .brand h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: #fbbf24;
      text-shadow: 0 0 18px rgba(245, 158, 11, 0.35);
    }

    .brand p {
      margin: 3px 0 0;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .sp-block {
      margin-left: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 8px 18px;
      border-radius: 13px;
      border: 1px solid rgba(245, 158, 11, 0.28);
      background: rgba(2, 6, 23, 0.55);
      box-shadow: inset 0 0 18px rgba(245, 158, 11, 0.06);
    }

    .sp-label {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #fcd34d;
      opacity: 0.9;
    }

    .sp-number {
      display: flex;
      align-items: baseline;
      gap: 5px;
      line-height: 1;
    }

    #remaining-sp {
      font-family: 'Cinzel', serif;
      font-size: 30px;
      font-weight: 900;
      color: #fbbf24;
      text-shadow: 0 0 16px rgba(245, 158, 11, 0.5);
      font-variant-numeric: tabular-nums;
    }

    .sp-number em {
      font-style: normal;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      font-family: 'Cinzel', serif;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
      padding: 9px 15px;
      border-radius: 9px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform 0.15s ease, filter 0.15s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .btn.ghost {
      background: rgba(30, 41, 59, 0.7);
      border-color: rgba(148, 163, 184, 0.22);
      color: #cbd5e1;
    }

    .btn.ghost:hover {
      background: rgba(127, 29, 29, 0.35);
      border-color: rgba(239, 68, 68, 0.45);
      color: #fecaca;
    }

    .btn.primary {
      background: linear-gradient(180deg, #fbbf24, #f59e0b);
      border-color: #fcd34d;
      color: #20150a;
      box-shadow: 0 8px 18px -10px rgba(245, 158, 11, 0.85);
    }

    .btn.primary:hover {
      filter: brightness(1.07);
      transform: translateY(-1px);
    }

    .btn:active { transform: translateY(0) scale(0.98); }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      --accent: #f59e0b;
      --soft: var(--gold-soft);
      --line-c: var(--gold-line);
      --val: #fde68a;
      --glow: rgba(245, 158, 11, 0.35);

      position: relative;
      display: flex;
      flex-direction: column;
      gap: 11px;
      padding: 16px;
      min-height: 206px;
      border-radius: 15px;
      border: 1px solid var(--line);
      background:
        radial-gradient(130% 100% at 100% 0%, var(--soft) 0%, transparent 58%),
        var(--panel-bg);
      box-shadow: 0 16px 32px -24px #000, inset 0 1px 0 rgba(255, 255, 255, 0.04);
      overflow: hidden;
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0 0 auto 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--line-c) 30%, var(--accent) 50%, var(--line-c) 70%, transparent);
      opacity: 0.85;
      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--line-c);
      box-shadow: 0 22px 38px -24px var(--glow), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      font-size: 20px;
      border-radius: 11px;
      border: 1px solid var(--line-c);
      background: linear-gradient(155deg, var(--soft), rgba(2, 6, 23, 0.4));
      box-shadow: inset 0 0 14px var(--soft);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .titles { min-width: 0; }

    .en {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--accent);
      opacity: 0.9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .titles h2 {
      margin: 2px 0 0;
      font-size: 14.5px;
      font-weight: 800;
      letter-spacing: 0.02em;
      display: flex;
      align-items: baseline;
      gap: 4px;
      white-space: nowrap;
    }

    .zh-en {
      font-family: 'Cinzel', serif;
      font-size: 9.5px;
      font-weight: 600;
      color: #64748b;
    }

    .pts {
      margin-left: auto;
      flex: none;
      padding: 3px 7px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.14);
      background: rgba(2, 6, 23, 0.6);
      font-family: 'Cinzel', serif;
      font-size: 10px;
      font-weight: 700;
      color: #cbd5e1;
      font-variant-numeric: tabular-nums;
    }

    .pts b {
      color: var(--val);
      font-weight: 800;
    }

    .value-row {
      position: relative;
      display: flex;
      align-items: baseline;
      gap: 7px;
      flex-wrap: wrap;
    }

    .value {
      display: inline-block;
      font-family: 'Cinzel', serif;
      font-size: 28px;
      font-weight: 800;
      line-height: 1;
      color: var(--val);
      text-shadow: 0 0 18px var(--glow);
      font-variant-numeric: tabular-nums;
    }

    .value.bump { animation: statPop 0.35s ease-out; }

    .unit {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #64748b;
    }

    .gain {
      font-size: 9.5px;
      font-weight: 700;
      color: #94a3b8;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.14);
      background: rgba(148, 163, 184, 0.08);
      white-space: nowrap;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: auto;
    }

    .tags span {
      font-size: 9.5px;
      line-height: 1.4;
      padding: 2px 6px;
      border-radius: 5px;
      border: 1px solid var(--line-c);
      background: var(--soft);
      color: var(--val);
      opacity: 0.92;
      white-space: nowrap;
    }

    .meter {
      height: 4px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(2, 6, 23, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.08);
    }

    .meter-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--val));
      box-shadow: 0 0 8px var(--glow);
      transition: width 0.28s ease;
    }

    .controls {
      display: flex;
      gap: 7px;
    }

    .minus, .plus {
      font-family: inherit;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 800;
      transition: transform 0.12s ease, filter 0.15s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .minus {
      width: 36px;
      flex: none;
      font-size: 16px;
      line-height: 1;
      color: #cbd5e1;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.22);
    }

    .minus:hover:not(:disabled) {
      background: rgba(51, 65, 85, 0.95);
      border-color: rgba(148, 163, 184, 0.45);
      color: #fff;
    }

    .plus {
      flex: 1;
      font-size: 11.5px;
      letter-spacing: 0.02em;
      color: #20150a;
      background: linear-gradient(180deg, #fcd34d, #f59e0b);
      border: 1px solid #fde68a;
      box-shadow: 0 6px 14px -8px rgba(245, 158, 11, 0.9);
    }

    .plus:hover:not(:disabled) { filter: brightness(1.08); }

    .minus:active:not(:disabled),
    .plus:active:not(:disabled) { transform: scale(0.96); }

    button:disabled {
      opacity: 0.32;
      cursor: not-allowed;
      filter: grayscale(0.6);
      box-shadow: none;
    }

    .card.hero {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: minmax(230px, 1fr) minmax(230px, 1.15fr) 216px;
      align-items: center;
      gap: 26px;
      min-height: 0;
      padding: 20px 22px;
    }

    .hero-head {
      display: flex;
      align-items: flex-start;
      gap: 13px;
    }

    .hero .icon {
      width: 54px;
      height: 54px;
      flex: 0 0 54px;
      font-size: 26px;
      border-radius: 14px;
    }

    .hero .en { font-size: 9.5px; }

    .hero .titles h2 { font-size: 19px; }

    .hero .titles h2 .zh-en { font-size: 11px; }

    .hero .tags { margin-top: 8px; }

    .hero .value {
      font-size: 42px;
      letter-spacing: -0.01em;
    }

    .hero .unit { font-size: 11px; }

    .sub {
      margin-top: 7px;
      font-size: 10.5px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .sub span {
      font-weight: 700;
      color: var(--val);
    }

    .hero-side {
      display: flex;
      flex-direction: column;
      gap: 9px;
      min-width: 0;
    }

    .hero-side .pts {
      margin-left: 0;
      align-self: flex-start;
    }

    .hero-side .controls { margin-top: 2px; }

    .float-gain {
      position: absolute;
      left: 0;
      top: -4px;
      pointer-events: none;
      font-family: 'Cinzel', serif;
      font-size: 14px;
      font-weight: 800;
      color: var(--val);
      text-shadow: 0 0 12px var(--glow);
      animation: floatUp 0.9s ease-out forwards;
      white-space: nowrap;
    }

    @keyframes floatUp {
      0%   { opacity: 0; transform: translateY(4px) scale(0.8); }
      25%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(-24px) scale(1.05); }
    }

    @keyframes statPop {
      0%   { transform: scale(1); filter: brightness(1); }
      50%  { transform: scale(1.1); filter: brightness(1.45); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    .hint {
      margin: 16px 2px 0;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.02em;
      color: #64748b;
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid rgba(245, 158, 11, 0.5);
      background: rgba(8, 13, 23, 0.97);
      color: #fcd34d;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: 0 18px 40px -16px #000;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 14px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 1120px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .card.hero { grid-template-columns: minmax(220px, 1fr) 1fr 200px; gap: 18px; }
    }

    @media (max-width: 900px) {
      .card.hero {
        grid-template-columns: 1fr;
        gap: 16px;
        padding: 18px;
      }
      .hero .value { font-size: 36px; }
      .hero-side { max-width: 320px; width: 100%; }
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .topbar { padding: 15px 16px; }
      .sp-block { margin-left: 0; }
      .actions { margin-left: auto; }
      .card { min-height: 0; }
    }

    @media (max-width: 520px) {
      body { padding-top: 16px; }
      .grid { grid-template-columns: 1fr; }
      .card.hero { padding: 16px; }
      .hero .value { font-size: 34px; }
      .brand { width: 100%; }
      .brand h1 { font-size: 18px; }
      .sp-block {
        order: 3;
        width: 100%;
        flex-direction: row;
        justify-content: center;
        align-items: baseline;
        gap: 10px;
        padding: 8px 12px;
      }
      .actions { order: 2; }
      #toast { white-space: normal; text-align: center; max-width: 88vw; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <div class="crest" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 10V3L4 14h7v7l9-11h-7z" />
          </svg>
        </div>
        <div>
          <h1>屬性配點 · 整合</h1>
          <p>六大屬性升級 · 每次升級消耗 1 點</p>
        </div>
      </div>

      <div class="sp-block">
        <span class="sp-label">剩餘點數 (SP)</span>
        <div class="sp-number">
          <span id="remaining-sp">20</span>
          <em>/ <span id="sp-total">20</span></em>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn ghost" id="btn-reset">重置</button>
        <button type="button" class="btn primary" id="btn-save">儲存配置</button>
      </div>
    </header>

    <main class="grid" id="stat-grid" aria-label="屬性加點面板"></main>

    <p class="hint">每次升級消耗 1 點 · 單項屬性上限 20 點 · 點擊「−」可退回點數</p>
  </div>

  <div id="toast" role="status" aria-live="polite">
    <span aria-hidden="true">✦</span>
    <span id="toast-msg">已儲存配置</span>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
